  - SCAN
  - tree_path_frozen_on_development
  early_variants:
  - L
  - E
  logical_conditions: 4
  rounds: 6
  processes: 24
- id: V3_Tloc
  dataset: Tloc
  radii:
  - normal
  B:
  - 1
  - 32
  paths:
  - SCAN
  - tree_path_frozen_on_development
  early_variants:
  - L
  - E
  logical_conditions: 8
  rounds: 6
  processes: 48
formal_budget_upper_bound:
  conditions: 44
  independent_processes: 264
  queries_per_process: 1024
  exclude:
  - pilot
  - sanitizer
  - profiling
  - external_baseline
  execute_by_stage_gates: true
timing:
  primary: host_ready_batch_ms
  secondary: gpu_ready_batch_ms
  include:
  - query H2D
  - node and hit initialization
  - tree prefix
  - mask construction
  - candidate/task compaction
  - distance
  - common output collection
  - count feedback
  - valid result D2H
  - synchronization
  exclude:
  - static tree/layout/refit setup
  - warmup
  - oracle
  - hash and logs
  - profiling
  host_input_preparation: match prior boundary and disclose pinned memcpy placement
  warmup_development_batches: 8
  rounds: 6
  mode_order: rotate within rounds
  batch_membership: same across modes; reverse execution order without changing pair membership
  qps: query_count / sum(host_ready_batch_seconds); excludes audit and logging
  batch_divided_by_B_is_response_latency: false
  ratios: paired round total ratios; six values, median, range, paired round bootstrap
work_metrics:
- candidate_pairs
- candidate_union_objects
- candidate_intersection_objects
- nonempty_task_count
- mask_population
- pair_coordinate_updates
- shared_coordinate_steps
- warp_span_steps
- pivot_distance_count
- candidate_task_bytes
- output_results
- output_bytes
profiling:
  separate_binary: true
  whole_pipeline_and_distance_separate: true
  ncu_replay: validated application/range replay when supported for cache reuse
  cache_control: none, identical and recorded
  clock_control: none unless independently authorized uniform control
  metrics:
  - DRAM reads and writes per stage
  - L1/L2 requests
  - registers/spills
  - FP64 activity
  - warp execution
  profile_values_are_not_formal_timing: true
external_baseline:
  required_attempt: true
  family: cuVS pairwise distance + complete range selection + full host output
  task_is_not_topk: true
  first_dtype: float64 direct L2 when actually supported
  datasets:
  - GIST
  radii:
  - half
  - normal
  - all
  B:
  - 8
  - 32
  freeze_library_versions: true
  isolated_environment: true
  development_frozen_reasonable_tiling: true
  strict_sequence_vs_library_semantics: separate reporting; audit complete membership and boundaries
  mismatch: preserve raw result; no free oracle correction; any certified fallback fully timed
  failure: save exact build/runtime error; no external superiority claim
decision_rules:
  strong_followup_speedup_min: 1.1
  strong_followup_wins: 6
  paired_interval_lower_gt: 1.0
  small_gain: 1.03x-1.10x retain engineering evidence; no universal claim
  unresolved: less than 1.03x or unstable; stop parameter chasing
  beat_C_ID_but_not_scan: candidate organization win only, not index net benefit
  correctness_failure: exclude performance promotion; retain evidence
evidence_policy:
  preserve_prior_positive_and_negative_results: true
  multiply_historical_speedups: false
  runtime_oracle_selector: false
  new_results_status: none
