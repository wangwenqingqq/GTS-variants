# Proposed P4 experiment specification; not an executable GPU runner.
experiment: GTS P4 exact high-dimensional batch tree inheritance
date: '2026-10-02'
status: DESIGN_ONLY_NOT_IMPLEMENTED_NOT_RUN
repository:
  name: wangwenqingqq/GTS-variants
  baseline_commit: 43463278fa1f2b7b8e6e36ff224e5c640036963e
  branch: experiments/gts-optimization-results-20260928
  new_directory: diagnostics/batch_tree_inheritance_20261002
  mutate_production: false
primary_question: Does a safe tree prefix reduce total host-ready batch time versus the current strongest matched
  batch scan, without sacrificing sharing?
gpu:
  host: pro6000-8
  uuid: GPU-e5a0e7f5-9917-c2a1-ee8e-7282cbba2603
  require_authorized_idle_admission: true
  verify_actual_versions: true
  change_global_driver_clock_settings: false
  record_cpu_and_memory_numa_policy: true
scope:
  task: static_exact_L2_range
  queries: in_database_qids
  batch_sizes_primary:
  - 8
  - 32
  batch1_regression: true
  updates: false
  knn: false
  online_queueing: false
  multi_gpu: false
datasets:
  GIST:
    n: 1000000
    d: 960
    prefix_depth: 4
    role: primary
    radii_f32_bits:
      half: '0x3f34a3d8'
      normal: '0x3fb4a3d8'
      all: '0x41cb7260'
  Deep:
    n: 1000000
    d: 96
    prefix_depth: 1
    role: negative_highdim_replication
    radii_f32_bits:
      normal: '0x3f8a3818'
  Tloc:
    n: 1000000
    d: 2
    prefix_depth: 4
    role: historical_positive_regression_only
    radii_source: load actual historical frozen manifest; verify bit pattern
    development_if_missing: sample disjoint dev256 before the new final1024
arithmetic:
  input: finite_float32
  accumulator: float64
  reference: explicit RN sub/mul/add in increasing dimension order
  fma: false
  early_check_dims: 32
  early_predicate: partial_sum > RN(double(radius)*double(radius))
  negative_radius: empty
  nonfinite_data_or_radius: reject_at_entry
  distance_field: sqrt(reference_sum) cast float32
  pivot_early_by_query_radius: false
common_execution:
  layout: AoSoA32 in frozen id_list order
  query_tile: 2
  object_tile: 32
  threads_per_block: 512
  no_query_reordering: true
  same_output_pipeline: true
  cuda_graph: fixed upper launch grid; device task count; record empty launch overhead
  query_tile_search: false
  tree_depth_search: false
  no_vector_repack_per_query: true
tree:
  topology_and_membership: frozen historical tree dump; hash audit
  bounds: inherited conservative FP64 outward intervals; validate candidate set
  refit: static cost separately reported
  node_for_pos: static fixed-depth membership map
  parent_pivot_reuse: reuse only among verified identical pivot IDs; common to all tree modes
  compare_to_original_strict_candidates: true
modes:
  SCAN:
    prefix: false
    organization: existing TILE kernel
    query_tile: 2
    early_variants:
    - L
    - E
  C_ID:
    prefix: true
    organization: stable per-query candidate position lists; two independent gathered IDs per rank
    query_tile: 2
    early_variants:
    - L
    - E
    no_fake_shared_value_for_different_ids: true
  C_MASK:
    prefix: true
    organization: dense original tiles with per-query masks; no task compaction
    query_tile: 2
    early_variants:
    - L
    - E
  C_TASK:
    prefix: true
    organization: compact nonempty (query_pair, tile, mask0, mask1) records
    query_tile: 2
    early_variants:
    - L
    - E
task_contract:
  skip_only_if: (mask0 | mask1) == 0
  intersection_only_forbidden: true
  unique_key:
  - query_pair
  - tile_id
  merge_duplicate_masks: true
  preserve_original_tile_lanes: true
  warp_per_tile: true
  initialize_unvisited_hits_to_zero: true
  time_all_resets_and_candidate_builds: true
  scratch_masks_not_oracle_derived: true
  tail_tile_bits_zero: true
output:
  implementation: reuse batch_output.cuh
  order: query order then frozen id_list order
  counts_offsets_bits: 64
  delivery: counts/offsets then all valid IDs and distances; all feedback charged
  truncate: false
  oracle_size_hint: false
  tree_sparse_slot_reset: common timed strategy
memory:
  dynamic_workspace_limit_gib: 8
  pinned_output_limit_gib: 4
  static_data_layout_index_account_separately: true
  overflow: fail or common bounded method; never truncate
  existing_dense_pair_flags_and_distance_slots_disclosed: true
queries:
  development: reuse P0-P3 dev256
  historical_sets: 24/64 plus previous final1024 retained as known regression
  new_final_count_per_dataset: 1024
  seed: 20261002
  dataset_seed_offsets:
    GIST: 0
    Deep: 1
    Tloc: 2
  exclude_all_historical_development_regression_ids: true
  freeze_implementation_before_final: true
  grouping: frozen random order; nested consecutive batches; fixed query pairs
  oracle_or_similarity_grouping: false
  revalidate_all_hit_for_new_queries: true
phases:
- id: V0
  name: small_correctness_and_candidate_identity
  N:
  - 4096
  - 4103
  D:
  - 2
  - 31
  - 32
  - 33
  - 96
  - 960
  B:
  - 1
  - 3
  - 8
  - 32
  - 33
  coverage: document actual combinations; not automatically all Cartesian cases
  independent_cpu_small_oracle: true
  million_scale_representative_gate: true
- id: V1
  name: pilot_candidate_ledger
  dataset: GIST
  radius: half
  B:
  - 8
  - 32
  split: dev256
  rounds: 3
  modes:
  - SCAN_E
  - C_ID_E
  - C_MASK_E
  - C_TASK_E
  - SCAN_L
- id: V2
  name: primary_formal
  dataset: GIST
  radii:
  - half
  B:
  - 8
  - 32
  paths:
  - SCAN
  - C_ID
  - C_MASK
  - C_TASK
  early_variants:
  - L
  - E
  logical_conditions: 16
  rounds: 6
  processes: 96
- id: V3_GIST
  name: boundary_formal
  dataset: GIST
  radii:
  - normal
  - all
  B:
  - 32
  paths:
  - SCAN
  - C_ID
  - C_MASK
  - C_TASK
  early_variants:
  - L
  - E
  logical_conditions: 16
  rounds: 6
  processes: 96
- id: V3_Deep
  dataset: Deep
  radii:
  - normal
  B:
  - 32
