region_plan:
  block_threads: 256
  max_objects: 256
  max_nonempty_nodes: 128
  local_node_capacity: 128
  selection: maximal nonempty subtree satisfying both object/node bounds
  static_query_independent: true
  region_roots_form_antichain: true
  base_positions_partition_exactly: true
  overlarge_terminal_leaf: registered same-semantics fallback; no truncation
  memory: query shared cache + local node/leaf queues; actual resource report required
  grid: query x static region, uniform return for inactive root
  unbounded_global_queue: false
  dynamic_parallelism: false
modes:
  A: NATIVE
  B: PAR_STRONG
  C: REGION_SPLIT
  D: REGION_FUSED
common_new_mode_features:
- same arithmetic and pruning predicate
- actual-pid-checked sibling reuse
- multi-block upper skeleton
- same allocation policy and canonical output collector
- same initial tree and update/event sequence
fusion_control:
  SPLIT: local multi-level traversal -> global per-region leaf list -> verification
    kernel
  FUSED: same traversal -> shared-memory leaf list -> verification in same block
  same_candidates_and_distance_counts_required: true
  final_N_hit_array_retained: true
  all_materialization_eliminated_claim: false
output:
  canonical_order: original terminal-leaf enumeration then in-leaf order, verified
    from native path
  unique_writer: one query/base-position slot
  stable_compaction: true
  result_id: base physical index, not vector content or packed position
  buffer_merge: original routine unchanged
  deduplicate_equal_vectors: false
lifecycle:
  tree_epoch: structure/mapping only, not MVCC
  tombstone: refresh current view; no region replan unless structure changes
  pivot_deleted: still valid geometric reference while physical row exists
  buffer_insert: not in base region; original buffer scan must remain
  rebuild: finish old query; rebuild; replan and remap; increment epoch; publish;
    ACK
  all_refresh_time_charged: true
  CPU_planner_transfers_charged: true
  context_initialization_report_separately: true
